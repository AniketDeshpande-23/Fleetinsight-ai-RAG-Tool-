services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      # Override Ollama URL to reach host machine from container
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./vector_store:/app/vector_store
      - ./data:/app/data
    networks:
      - rag-net
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:8001
    depends_on:
      - backend
    networks:
      - rag-net
    restart: unless-stopped

networks:
  rag-net:
    driver: bridge
